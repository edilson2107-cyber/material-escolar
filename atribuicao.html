<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atribuição de Classes e Aulas · URE Sul 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{
  --vermelho:#E8252B; --vermelho-esc:#C21017; --vermelho-sutil:#FDEDEE;
  --grafite:#231F20; --tinta:#14161A;
  --c900:#1E232B; --c700:#454C58; --c500:#6B7483; --c300:#C9CFD8; --c200:#E3E7EC; --c100:#F1F4F7; --c50:#F8FAFC;
  --verde:#107A4D; --verde-s:#E6F4EC; --ambar:#B06A00; --ambar-s:#FDF2E2; --azul:#1F5FA8; --azul-s:#E9F1FA;
  --sombra:0 1px 2px rgba(20,22,26,.05), 0 8px 24px rgba(20,22,26,.06);
  --sombra-forte:0 20px 50px rgba(20,22,26,.20);
  --fonte:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --t:.18s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fonte);color:var(--c900);background:#F6F7F9;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--azul)}
.oculto{display:none!important}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--c200)}
.topo-in{max-width:1040px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:14px}
.topo img{height:36px;cursor:pointer}
.marca{flex:1;min-width:0;cursor:pointer}
.marca b{display:block;font-size:15px;letter-spacing:-.01em}
.marca span{display:block;font-size:12px;color:var(--c500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-busca{display:flex;align-items:center;gap:10px;border:1px solid var(--c200);background:var(--c50);color:var(--c500);
  border-radius:10px;padding:8px 12px 8px 12px;cursor:pointer;font-size:13.5px;min-width:220px;transition:var(--t)}
.btn-busca:hover{border-color:var(--c300);background:#fff}
.btn-busca kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--c200);border-radius:5px;padding:1px 6px;background:#fff}

.pagina{max-width:1040px;margin:0 auto;padding:0 24px 80px}

/* ---------- início ---------- */
.inicio{padding:64px 0 28px;text-align:center}
.inicio .sigla{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--vermelho);margin-bottom:12px}
.inicio h1{font-size:34px;letter-spacing:-.035em;line-height:1.15;margin:0 0 10px;color:var(--tinta)}
.inicio p{color:var(--c500);margin:0 auto;max-width:520px;font-size:15.5px}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.area{background:#fff;border:1px solid var(--c200);border-radius:16px;padding:24px 22px;text-align:left;cursor:pointer;
  transition:var(--t);display:flex;flex-direction:column;gap:6px}
.area:hover{border-color:transparent;box-shadow:0 0 0 2px var(--vermelho),var(--sombra);transform:translateY(-2px)}
.area .ic{width:46px;height:46px;border-radius:12px;background:var(--vermelho-sutil);display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:10px}
.area b{font-size:16px;letter-spacing:-.01em;color:var(--tinta)}
.area span{font-size:13px;color:var(--c500)}
.area .tx{display:flex;flex-direction:column;gap:3px}
.area .qtd{margin-top:10px;font-size:12px;font-weight:600;color:var(--c700)}
.aviso-linha{margin:28px auto 0;max-width:640px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--c200);
  border-radius:12px;padding:12px 16px;font-size:13.5px;cursor:pointer;transition:var(--t);text-align:left;width:100%}
.aviso-linha:hover{border-color:var(--ambar)}
.aviso-linha .pt{width:8px;height:8px;border-radius:50%;background:var(--ambar);flex:0 0 auto;box-shadow:0 0 0 4px var(--ambar-s)}
.aviso-linha .ir{margin-left:auto;color:var(--c500);font-weight:600;font-size:12.5px;white-space:nowrap}

/* ---------- navegação ---------- */
.trilha{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c500);padding:28px 0 6px;flex-wrap:wrap}
.trilha a{color:var(--c500);text-decoration:none;cursor:pointer}
.trilha a:hover{color:var(--vermelho)}
.trilha i{font-style:normal;opacity:.5}

/* ---------- lista da área ---------- */
.cab-area{display:flex;align-items:center;gap:16px;margin:10px 0 26px}
.cab-area .ic{width:54px;height:54px;border-radius:14px;background:var(--vermelho-sutil);display:flex;align-items:center;justify-content:center;font-size:26px}
.cab-area h2{margin:0;font-size:26px;letter-spacing:-.03em}
.cab-area p{margin:2px 0 0;color:var(--c500);font-size:14px}
.lista{background:#fff;border:1px solid var(--c200);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--c100);cursor:pointer;transition:var(--t);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item:hover{background:var(--c50)}
.item .ic{font-size:20px;width:40px;height:40px;border-radius:10px;background:var(--c100);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px;letter-spacing:-.01em;color:var(--tinta)}
.item .tx span{font-size:13px;color:var(--c500)}
.item .tx .selo{font-size:10.5px;color:var(--azul)}
.item .seta{color:var(--c300);font-size:20px;transition:var(--t)}
.item:hover .seta{color:var(--vermelho);transform:translateX(3px)}
.selo{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;
  background:var(--azul-s);color:var(--azul);vertical-align:2px;margin-left:6px}

/* ---------- ficha ---------- */
.ficha{max-width:760px}
.ficha-cab{margin:10px 0 24px}
.ficha-cab .ic{width:54px;height:54px;border-radius:14px;background:var(--vermelho-sutil);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.ficha-cab h2{margin:0 0 8px;font-size:27px;letter-spacing:-.03em;line-height:1.2;color:var(--tinta)}
.ficha-cab p{margin:0;color:var(--c700);font-size:15.5px}
.acoes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--c200);background:#fff;border-radius:9px;padding:8px 13px;
  font-size:13px;font-weight:600;cursor:pointer;transition:var(--t);color:var(--c700)}
.btn:hover{border-color:var(--c300);color:var(--tinta)}
.btn-pri{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn-pri:hover{background:var(--vermelho-esc);color:#fff}

.bloco{background:#fff;border:1px solid var(--c200);border-radius:16px;padding:26px 28px;margin-bottom:14px}
.bloco h3{margin:0 0 18px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c500)}
ol.passos{list-style:none;counter-reset:p;margin:0;padding:0}
ol.passos li{counter-increment:p;position:relative;padding:0 0 22px 46px;cursor:pointer}
ol.passos li:last-child{padding-bottom:0}
ol.passos li::before{content:counter(p);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--c300);color:var(--c700);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  background:#fff;transition:var(--t)}
ol.passos li::after{content:'';position:absolute;left:13.5px;top:32px;bottom:4px;width:1.5px;background:var(--c200)}
ol.passos li:last-child::after{display:none}
ol.passos li b{display:block;font-size:15px;color:var(--tinta);margin:3px 0 2px}
ol.passos li span{font-size:14px;color:var(--c700)}
ol.passos li.feito::before{content:'✓';background:var(--verde);border-color:var(--verde);color:#fff}
ol.passos li.feito b{color:var(--c500);text-decoration:line-through;text-decoration-color:var(--c300)}
.dica-passos{font-size:12.5px;color:var(--c500);margin:-8px 0 18px}

/* sanfonas */
.sanfona{background:#fff;border:1px solid var(--c200);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sanfona > button{width:100%;display:flex;align-items:center;gap:12px;padding:17px 22px;background:none;border:0;cursor:pointer;text-align:left}
.sanfona > button b{font-size:15px;flex:1;color:var(--tinta)}
.sanfona > button .n{font-size:12px;font-weight:600;color:var(--c500);background:var(--c100);border-radius:999px;padding:2px 9px}
.sanfona > button .n.alerta{background:var(--ambar-s);color:var(--ambar)}
.sanfona > button .chev{color:var(--c500);transition:var(--t)}
.sanfona.aberta > button .chev{transform:rotate(180deg)}
.sanfona .conteudo{display:none;padding:0 22px 20px}
.sanfona.aberta .conteudo{display:block}
ul.check{list-style:none;margin:0;padding:0}
ul.check li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--c100);font-size:14px}
ul.check li:first-child{border-top:0}
ul.check input{margin-top:4px;accent-color:var(--vermelho);width:16px;height:16px;flex:0 0 auto}
.modelo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--c100)}
.modelo:first-child{border-top:0}
.modelo .tx{flex:1;min-width:0}
.modelo .tx b{display:block;font-size:13.5px;font-weight:600;word-break:break-word}
.modelo .tx span{font-size:12.5px;color:var(--c500)}
.modelo a{font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.et{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.et-usar{background:var(--verde-s);color:var(--verde)} .et-revisar{background:var(--ambar-s);color:var(--ambar)} .et-substituir{background:var(--vermelho-sutil);color:var(--vermelho-esc)}
.lei{padding:11px 0;border-top:1px solid var(--c100);font-size:14px}
.lei:first-child{border-top:0}
.lei b{display:block}
.lei span{color:var(--c700);font-size:13.5px}
.lei a{font-size:12.5px;font-weight:600;margin-left:6px}
.atencao{display:flex;gap:10px;padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:8px}
.atencao:last-child{margin-bottom:0}
.at-erro{background:var(--vermelho-sutil);color:var(--vermelho-esc)} .at-ambar{background:var(--ambar-s);color:#8A5300} .at-azul{background:var(--azul-s);color:var(--azul)}
.verificar{display:inline-block;background:#fff;color:var(--ambar);border:1px solid #F1D4A6;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em}

/* calculadora dentro da ficha */
.calc{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.calc label{display:block;font-size:12px;font-weight:600;color:var(--c700);margin-bottom:5px}
.calc input,.calc select{padding:9px 11px;border:1px solid var(--c300);border-radius:8px;background:#fff;outline:0}
.calc input:focus,.calc select:focus{border-color:var(--vermelho);box-shadow:0 0 0 3px var(--vermelho-sutil)}
.calc .res{flex:1;min-width:200px;font-size:14px;color:var(--c700);padding:9px 0}
.calc .res b{color:var(--vermelho-esc)}

/* ---------- busca (sobreposição) ---------- */
.sobre{position:fixed;inset:0;z-index:100;background:rgba(20,22,26,.35);backdrop-filter:blur(3px);display:flex;justify-content:center;
  align-items:flex-start;padding:12vh 20px 20px}
.paleta{width:100%;max-width:600px;background:#fff;border-radius:16px;box-shadow:var(--sombra-forte);overflow:hidden}
.paleta .campo{display:flex;align-items:center;gap:12px;padding:6px 18px;border-bottom:1px solid var(--c200)}
.paleta input{flex:1;border:0;outline:0;font-size:17px;padding:14px 0;background:none}
.paleta .esc{font-size:11px;border:1px solid var(--c200);border-radius:5px;padding:1px 6px;color:var(--c500);cursor:pointer;background:#fff}
.resultados{max-height:52vh;overflow-y:auto;padding:8px}
.res-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.res-item.ativo,.res-item:hover{background:var(--c100)}
.res-item .ic{font-size:18px;width:34px;text-align:center}
.res-item b{display:block;font-size:14px;color:var(--tinta)}
.res-item span{font-size:12.5px;color:var(--c500)}
.res-vazio{padding:26px 16px;text-align:center;color:var(--c500);font-size:13.5px}
.res-rot{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c500);padding:8px 12px 4px}

/* ---------- janela de avisos ---------- */
.janela{width:100%;max-width:560px;background:#fff;border-radius:16px;box-shadow:var(--sombra-forte);padding:26px 28px}
.janela h3{margin:0 0 16px;font-size:18px;letter-spacing:-.02em}
.janela .av{padding:14px 0;border-top:1px solid var(--c100)}
.janela .av b{display:block;font-size:14.5px;margin-bottom:3px}
.janela .av p{margin:0 0 6px;font-size:13.5px;color:var(--c700)}
.janela .av a{font-size:13px;font-weight:600;cursor:pointer;color:var(--vermelho)}

#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200}
.toast{background:var(--grafite);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--sombra-forte);animation:sobe .25s ease}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rodape{text-align:center;font-size:12px;color:var(--c500);margin-top:48px}

@media(max-width:860px){ .areas{grid-template-columns:1fr 1fr} }
@media(max-width:600px){
  .topo-in{padding:0 16px;gap:10px} .pagina{padding:0 16px 60px}
  .btn-busca{min-width:0;padding:8px 10px} .btn-busca .txt,.btn-busca kbd{display:none}
  .marca span{display:none}
  .inicio{padding:40px 0 20px} .inicio h1{font-size:27px}
  .areas{grid-template-columns:1fr;gap:10px;margin-top:28px}
  .area{flex-direction:row;align-items:center;gap:14px;padding:16px}
  .area .ic{margin:0;flex:0 0 auto}
  .area .tx{display:flex;flex-direction:column}
  .area .qtd{display:none}
  .bloco{padding:20px 18px} .ficha-cab h2{font-size:23px} .item{padding:16px}
  .sobre{padding:8px}
}
@media print{ .topo,.acoes,.trilha{display:none!important} body{background:#fff} .sanfona .conteudo{display:block} }
  /* ---------- orientador ---------- */
.orientador{display:flex;gap:12px;max-width:680px;margin:28px auto 0;align-items:stretch}
.orientador label{position:absolute;left:-9999px}
.orientador input{flex:1;min-width:0;font:inherit;font-size:16.5px;padding:15px 18px;background:#fff;color:var(--tinta);
  border:1.5px solid var(--c300);border-radius:12px;outline:0;box-shadow:var(--sombra);transition:var(--t)}
.orientador input:focus{border-color:var(--vermelho);box-shadow:0 0 0 4px var(--vermelho-sutil),var(--sombra)}
.btn-orientar{flex:0 0 auto;border:0;border-radius:12px;padding:0 26px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--vermelho);color:#fff;box-shadow:var(--sombra)}
.btn-orientar:hover{background:var(--vermelho-esc)}
.exemplos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto 0;max-width:760px}
.exemplos button{border:1px solid var(--c200);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.8px;color:var(--c700);cursor:pointer;transition:var(--t)}
.exemplos button:hover{border-color:var(--vermelho);color:var(--vermelho-esc)}
.sep-areas{text-align:center;color:var(--c500);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:44px 0 0}
.sep-areas + .areas{margin-top:18px}
/* ---------- resposta ---------- */
.entendi{font-size:14px;color:var(--c500);margin:34px 0 8px;scroll-margin-top:80px}
.entendi b{color:var(--tinta)}
.nao-e{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;font-size:12.8px;color:var(--c500)}
.nao-e button{border:1px solid var(--c200);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--c700)}
.nao-e button:hover{border-color:var(--c300);color:var(--tinta)}
.nao-e .limpar{margin-left:auto;border-style:dashed}
.resp{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.resp-lado{position:sticky;top:84px;display:flex;flex-direction:column;gap:10px}
.resp-cab{display:flex;gap:16px;align-items:flex-start}
.resp-ic{width:50px;height:50px;border-radius:14px;background:var(--vermelho-sutil);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.resp-cab h2{margin:2px 0 6px;font-size:22px;letter-spacing:-.025em;line-height:1.25;color:var(--tinta)}
.resp-cab p{margin:0;color:var(--c700);font-size:14.5px}
.campos{display:flex;flex-direction:column}
.campo-l{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--c100);font-size:14px}
.campo-l:first-child{border-top:0;padding-top:0}
.campo-l b{color:var(--tinta);font-weight:600}
.campo-l span{color:var(--c700)}
.exemplo{margin-top:16px;background:var(--c50);border:1px dashed var(--c300);border-radius:12px;padding:14px 16px}
.ex-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ex-cab b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c500)}
.exemplo p{margin:0;font-size:14px;color:var(--tinta);font-style:italic}
ul.antes{margin:0;padding-left:18px;font-size:14px;color:var(--c700)}
ul.antes li{margin-bottom:6px}
.lado-card{background:#fff;border:1px solid var(--c200);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.lado-rot{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c500)}
.lado-card > b{font-size:13px;word-break:break-word;margin-bottom:4px}
.lado-nota{font-size:12.5px;color:var(--c500)}
.lado-dica{background:var(--azul-s);color:var(--azul);border-radius:12px;padding:13px 15px;font-size:13px}
.btn-bloco{width:100%;justify-content:center;text-decoration:none}
a.btn{cursor:pointer}
.lista-guias{border:1px solid var(--c200);border-radius:12px;overflow:hidden}
.lista-guias .item{padding:14px 16px}
.resp-vazia{margin:30px auto 0;max-width:640px;background:#fff;border:1px solid var(--c200);border-radius:14px;padding:18px 20px;text-align:center}
.resp-vazia b{display:block;margin-bottom:4px}
.resp-vazia span{font-size:13.5px;color:var(--c500)}
@media(max-width:860px){ .resp{grid-template-columns:1fr} .resp-lado{position:static} }
@media(max-width:600px){
  .orientador{flex-direction:column;gap:10px} .btn-orientar{width:100%;padding:14px 0}
  .campo-l{grid-template-columns:1fr;gap:3px} .exemplos{justify-content:flex-start}
  .inicio h1{font-size:28px}
}
@media print{ .resp-lado,.nao-e,.orientador,.exemplos{display:none!important} .resp{grid-template-columns:1fr} }


/* ---------- códigos do BFE ---------- */
.bfe-busca{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}
.bfe-busca input[type=text],.bfe-busca #bfe-q{flex:1;min-width:260px;font:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--c300);border-radius:12px;background:#fff;outline:none}
.bfe-busca #bfe-q:focus{border-color:var(--vermelho);box-shadow:0 0 0 3px var(--vermelho-sutil)}
.bfe-des{font-size:13px;color:var(--c500);display:flex;gap:6px;align-items:center;cursor:pointer}
.bfe-fav{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}

function casa(t, w){
  if (t === w) return 1;
  if (t.length >= 5 && w.length >= 5 && (w.startsWith(t.slice(0, Math.max(5, t.length-2))) || t.startsWith(w.slice(0, Math.max(5, w.length-2))))) return 0.85;
  if (t.length >= 6 && Math.abs(t.length - w.length) <= 1 && lev(t, w) <= (t.length >= 9 ? 2 : 1)) return 0.7;
  return 0;
}
/* para cada termo da pergunta, a palavra conhecida mais próxima */
function termosConhecidos(qt){
  const B = base();
  return qt.map(t => {
    if (B.df.has(t)) return {t, w:t, q:1};
    let melhor = null, mq = 0;
    B.vocab.forEach(w => { const s = casa(t, w); if (s > mq){ mq = s; melhor = w; } });
    return melhor && mq >= 0.85 ? {t, w:melhor, q:mq} : null;
  }).filter(Boolean);
}
function interpretar(q){
  const B = base(), qt = tokens(q);
  const kt = termosConhecidos(qt);
  if (!kt.length) return {lista:[], certeza:false, motivo:'vazio'};
  const pesoTotal = kt.reduce((s, k) => s + B.idf(k.w) * k.q, 0);
  const lista = B.itens.map(x => {
    let p = 0, cob = 0;
    kt.forEach(k => {
      let w = null, f = 0;
      if (x.all.has(k.w)){ w = k.w; f = k.q; }
      else { x.all.forEach(z => { const s = casa(k.t, z) * 0.9; if (s > f){ f = s; w = z; } }); }
      if (w){ const v = B.idf(k.w) * f; cob += v; p += v * (x.tit.has(w) ? 1.35 : 1); }
    });
    if (x.tipo === 'g') p *= 1.04;
    return {tipo:x.tipo, it:x.it, p, cob: cob / pesoTotal};
  }).filter(x => x.p > 0).sort((a, b) => b.p - a.p || b.cob - a.cob);
  if (!lista.length || lista[0].cob < 0.34) return {lista:[], certeza:false, motivo:'nada'};
  /* formulário x procedimento: perguntou "como fazer" → procedimento; citou formulário/campo → guia */
  const top = lista[0];
  if (top.tipo === 'g'){
    const iPai = lista.findIndex(x => x.tipo === 'd' && x.it.id === top.it.pai);
    const falaDeFormulario = /preench|campo|formul|ficha|\bf ?\d{1,2}\b|planilha|oficio|requerimento|modelo|apont|digit|confer/.test(norm(q));
    if (iPai > 0 && !falaDeFormulario && lista[iPai].p >= top.p * 0.9){ const pai = lista.splice(iPai, 1)[0]; lista.unshift(pai); }
  }
  const a = lista[0], b = lista[1];
  const parentes = b && ((a.tipo === 'g' && a.it.pai === b.it.id) || (b.tipo === 'g' && b.it.pai === a.it.id) || (a.tipo === 'g' && b.tipo === 'g' && a.it.pai === b.it.pai));
  const forte = kt.some(k => B.idf(k.w) >= 2.2 && a.it && (base().itens.find(x => x.it === a.it).all.has(k.w)));
  let certeza = a.cob >= 0.55 && forte;
  if (b && !parentes && b.p >= a.p * 0.88) certeza = false;
  return {lista, certeza, motivo: certeza ? 'ok' : 'ambiguo'};
}
function entender(q){ return interpretar(q).lista; }

function desenhar(){
  fecharCamada();
  const p = location.hash.replace(/^#\/?/,'').split('/');
  const app = document.getElementById('app');
  if (p[0] === 'area' && tema(p[1])) app.innerHTML = telaArea(p[1]);
  else if (p[0] === 'p' && porId(p[1])) { app.innerHTML = telaFicha(porId(p[1])); ligarCalc(p[1]); }
  else if (p[0] === 'g' && guia(p[1])) app.innerHTML = trilhaGuia(guia(p[1])) + respostaGuia(guia(p[1]), null);
  else if (p[0] === 'consulta') { app.innerHTML = telaConsulta(p[1] || 'ordem'); }
  else if (p[0] === 'matrizes') { app.innerHTML = telaMatrizes(p[1] || '', p.slice(2).join('/')); }
  else if (p[0] === 'o') { const q = decodeURIComponent(p.slice(1).join('/')); app.innerHTML = telaInicio(q); responder(q); }
  else app.innerHTML = telaInicio('');
  if (p[0] !== 'o') window.scrollTo(0,0);
}

function responder(q){
  const alvo = document.getElementById('resposta');
  const R = interpretar(q), r = R.lista;
  document.getElementById('areas-bloco').classList.toggle('oculto', r.length > 0);
  if (!r.length){
    alvo.innerHTML = '<div class="resp-vazia"><b>Não encontrei esse assunto na base de atribuição.</b><span>Escreva a situação com outras palavras. Exemplos: “fiquei adido”, “carga suplementar”, “manifestação de interesse”, “PEI”. Ou escolha uma área abaixo.</span></div>';
    document.getElementById('areas-bloco').classList.remove('oculto');
    return;
  }
  if (!R.certeza){
    const ops = r.slice(0, 4);
    alvo.innerHTML = '<div class="escolha"><b>Para responder certo, preciso saber qual destes é o seu caso:</b>' +
      ops.map(x => '<button onclick="ir(\''+(x.tipo==='g'?'g/':'p/')+x.it.id+'\')"><span class="ic">'+x.it.ic+'</span><span><b>'+esc(x.it.titulo)+'</b><small>'+

    setTimeout(() => { const e = document.querySelector('.escolha'); if (e) e.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
    return;
  }
  const top = r[0], outros = r.slice(1).filter(x => x.it.id !== top.it.id && x.p >= top.p * 0.5).slice(0, 3);
  const alt = '<div class="nao-e">' + (outros.length ? '<span>Não é isso?</span>' + outros.map(x =>

  alvo.innerHTML = '<div class="entendi">Entendi: <b>'+esc(top.it.titulo)+'</b></div>' + alt +
    (top.tipo === 'g' ? respostaGuia(top.it, q) : respostaDemanda(top.it));
  setTimeout(() => { const e = document.querySelector('.entendi'); if (e) e.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
}

/* ---------- prazos ---------- */
function calcHtml(tipo){
  if (tipo === 'recurso') return '<div class="calc"><div><label>Data do fato (publicação, sessão, decisão)</label><input type="date" id="cx-data"></div>' +
    '<div class="res" id="cx-res">Recurso em até 2 dias úteis; decisão em até 5 dias úteis.</div></div>';
  return '<div class="calc"><div><label>Data da atribuição</label><input type="date" id="cx-data"></div>' +
    '<div class="res" id="cx-res">Comparecer à escola em até 1 dia útil.</div></div>';
}
function maisUteis(dt, n){ const d = new Date(dt); let k = 0; while (k < n){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w !== 0 && w !== 6) k++; } return d; }
const fmt = d => d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
function ligarCalc(id){
  const tipo = CALC[id]; if (!tipo) return;
  const el = document.getElementById('cx-data'); if (!el) return;
  el.addEventListener('change', () => {
    if (!el.value) return; const [y,m,dd] = el.value.split('-').map(Number); const base = new Date(y,m-1,dd);
    const r = document.getElementById('cx-res');
    if (tipo === 'recurso'){ const lim = maisUteis(base, 2), dec = maisUteis(lim, 5);
      r.innerHTML = 'Protocolar o recurso até <b>'+fmt(lim)+'</b>. Se protocolar nesse dia, a decisão deve sair até <b>'+fmt(dec)+'</b>. Feriados não estão no cálculo.'; }
    else { r.innerHTML = 'Comparecer à escola até <b>'+fmt(maisUteis(base, 1))+'</b>. Feriados não estão no cálculo.'; }
  });
}

const mxNum = x => { if (typeof x === 'number') return x; const s = String(x);

  return html;

function mxFiltrar(v){ const q = mxN(v); document.querySelectorAll('.mx-t tbody tr[data-c], .mx-t tbody tr.mx-saiu').forEach(tr => {

function mxComponentes(){ const s = new Map(); MATRIZES.forEach(m => m.linhas.forEach(l => { const k = l[1].replace(/\*+$/,''); s.set(mxN(k), k); })); return [...s.values()].sort((a,b) => a.localeCompare(b,'pt')); }
function mxBusca(q){

  let qq = mxN(q); Object.keys(MX_REN).forEach(k => { if (mxN(k).includes(qq) || qq.includes(mxN(k))) qq = mxN(MX_REN[k]); });
  if (qq === 'o.e.' || qq === 'oe' || qq === 'o.e') qq = 'fundamentos';
  const res = [];
  MATRIZES.forEach(m => {
    const ant = m.ant ? Object.fromEntries(m.ant.linhas.map(l => [MX_REN[l[1]] || l[1], l])) : null;
    m.linhas.filter(l => mxN(l[1]).includes(qq)).forEach(l => res.push({m, l, a: ant ? ant[l[1]] : null}));

  });
  if (!res.length) return h + '<div class="mx-cmp none"><b>Nenhuma matriz transcrita tem esse componente.</b> Confira a grafia ou consulte as Res. 96, 98, 99, 100 e 101, cujas tabelas não estão aqui.</div>';

  const qq = mxN(q);
  const lista = MX_FORM.filter(x => !qq || mxN(x[2]+' '+x[3]+' '+x[4]+' '+x[5]).includes(qq));
  return '<p class="nota-c" style="margin-top:0">Ordem de atribuição dos componentes da Parte Diversificada e dos itinerários: formação prioritária, depois alternativa 1, depois alternativa 2 (Res. 102/2026, art. 12; Res. 103/2026, Anexo IX). Algumas células longas aparecem resumidas: confira a lista completa de cursos no anexo.</p>' +
    '<input class="mx-filtro" value="'+esc(q)+'" placeholder="Filtrar por componente ou formação (ex.: Química, Inglês)" oninput="mxFiltrarForm(this.value)">' +
    ['102/2026','103/2026'].map(r => { const it = lista.filter(x => x[0] === r); if (!it.length) return '';
      return '<h3 class="mx-h">'+(r==='102/2026'?'Ensino Fundamental — Res. 102/2026, Anexo VII':'Ensino Médio — Res. 103/2026, Anexo IX')+'</h3><div class="mx-tw"><table class="mx-t mx-ft"><thead><tr><th>Componente</th><th>Prioritária</th><th>Alternativa 1</th><th>Alternativa 2</th></tr></thead><tbody>' +
        it.map(x => '<tr data-f="'+esc(mxN(x.slice(2).join(' ')))+'"><th>'+esc(x[2])+'</th><td>'+esc(x[3])+'</td><td>'+(esc(x[4])||'<span class="mx-tr">–</span>')+'</td><td>'+(esc(x[5])||'<span class="mx-tr">–</span>')+'</td></tr>').join('') + '</tbody></table></div>'; }).join('') +
    '<p class="nota-c">No Anexo IX da Res. 103/2026, o cabeçalho impresso repete “Formação Alternativa - 1” na terceira coluna; aqui ela aparece como alternativa 2.</p>';
}
function mxFiltrarForm(v){ const q = mxN(v); document.querySelectorAll('.mx-ft tbody tr').forEach(tr => tr.style.display = !q || tr.dataset.f.includes(q) ? '' : 'none'); }

/* ---------- copiar ---------- */
const semTags = s => String(s).replace(/<[^>]+>/g,'').replace(/\s+confirmar\s*/gi,' (confirmar) ');
function copiarTexto(t){ const ok = () => toast('Copiado');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(()=>alt(t,ok)); else alt(t,ok); }
function alt(t, ok){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); ok();}catch(e){} a.remove(); }
function copiarGuia(id){ const g = guia(id);
  copiarTexto(g.titulo.toUpperCase() + '\n\n' + g.oque +
    (g.antes.length ? '\n\nANTES DE COMEÇAR\n' + g.antes.map(a => '• ' + semTags(a)).join('\n') : '') +
    '\n\nPARTE A PARTE\n' + g.campos.map(c => '• ' + c[0] + ': ' + semTags(c[1])).join('\n') +
    (g.exemplo ? '\n\nEXEMPLO\n' + g.exemplo : '') +
    '\n\nANDAMENTO\n' + g.andamento.map((p,i) => (i+1) + '. ' + p[0] + ' — ' + semTags(canal(p[1]))).join('\n') +
    (g.anexos.length ? '\n\nANEXOS\n' + g.anexos.map(a => '[ ] ' + a).join('\n') : '') + '\n\nAtribuição de Classes e Aulas — URE Sul 1'); }
function copiarFicha(id){ const d = porId(id);
  copiarTexto(d.titulo.toUpperCase() + '\n\nPASSO A PASSO\n' + d.passos.map((p,i) => (i+1)+'. '+p[0]+' — '+semTags(p[1])).join('\n') +
    '\n\nDOCUMENTOS\n' + d.docs.map(x => '[ ] '+x).join('\n') + '\n\nAtribuição de Classes e Aulas — URE Sul 1'); }

/* ---------- camadas: busca rápida e avisos ---------- */
function fecharCamada(){ document.getElementById('camada').innerHTML = ''; }
function camada(html){ document.getElementById('camada').innerHTML = '<div class="sobre" onclick="if(event.target===this)fecharCamada()">' + html + '</div>'; }
function abrirAvisos(){
  camada('<div class="janela"><h3>Avisos importantes</h3>' + ALERTAS.map(a =>
    '<div class="av"><b>'+esc(a[1])+'</b><p>'+esc(a[2])+'</p><a onclick="ir(\'p/'+a[3]+'\')">Abrir ficha →</a></div>').join('') +
    '<div style="text-align:right;margin-top:14px"><button class="btn" onclick="fecharCamada()">Fechar</button></div></div>');
}
let SEL = 0, RES = [];
function abrirBusca(){
  camada('<div class="paleta"><div class="campo"><span>🔍</span>' +
    '<input id="q" placeholder="Buscar etapa, regra ou situação" autocomplete="off">' +
    '<span class="esc" onclick="fecharCamada()">Esc</span></div><div class="resultados" id="res"></div></div>');
  const q = document.getElementById('q');
  q.addEventListener('input', () => { SEL = 0; listar(q.value); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ SEL = Math.min(SEL+1, RES.length-1); marcar(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ SEL = Math.max(SEL-1, 0); marcar(); e.preventDefault(); }
    else if (e.key === 'Enter' && RES[SEL]) abrirRes(RES[SEL]);
  });
  listar(''); q.focus();
}
function abrirRes(x){ ir((x.tipo === 'g' ? 'g/' : 'p/') + x.it.id); }
function listar(v){
  const alvo = document.getElementById('res');
  if (!tokens(v).length){
    RES = ['g_manifestacao','g_recurso'].map(id => ({tipo:'g', it:guia(id)}))
      .concat(['confirmacao','adido','assumir','calendario'].map(id => ({tipo:'d', it:porId(id)})));
    alvo.innerHTML = '<div class="res-rot">Mais procurados</div>' + RES.map(linhaRes).join(''); marcar(); return;
  }
  RES = entender(v).slice(0, 7);
  alvo.innerHTML = RES.length ? RES.map(linhaRes).join('') : '<div class="res-vazio">Nada encontrado. Tente “adido”, “PEI” ou “recurso”.</div>';
  marcar();
}
function linhaRes(x, i){ const sub = x.tipo === 'g' ? 'Guia · ' + esc(porId(x.it.pai).titulo) : 'Ficha · ' + esc(tema(x.it.tema).nome);
  return '<button class="res-item" data-i="'+i+'" onmouseenter="SEL='+i+';marcar()" onclick="abrirRes(RES['+i+'])">' +
  '<span class="ic">'+x.it.ic+'</span><span><b>'+esc(x.it.titulo)+'</b><span>'+sub+'</span></span></button>'; }
function marcar(){ document.querySelectorAll('.res-item').forEach(b => b.classList.toggle('ativo', Number(b.dataset.i) === SEL)); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); abrirBusca(); }
  else if (e.key === 'Escape') fecharCamada();
});
</script>
